name: Build APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon 2>&1 | tee gradle-build.log

      - name: Comment Gradle log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          text = Path("gradle-build.log").read_text(errors="replace")
          tail = text[-50000:]
          body = "Gradle assembleDebug failed. Last log:\n\n```\n" + tail + "\n```\n"
          Path("/tmp/pr-comment.md").write_text(body)
          PY
          gh pr comment ${{ github.event.pull_request.number || 2 }} --body-file /tmp/pr-comment.md

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GhostDisplay-1.3.10-debug.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostDisplay-apk
          path: dist/GhostDisplay-1.3.10-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.10
          name: GhostDisplay 1.3.10
          body: |
            Sideload this debug APK on Android 10+.
            Package id: `com.ghostdisplay.app.debug`

            1.3.9 never reached the hidden display: screen-capture consent stopped the hold screen, GhostService then tried to launch with no resumed activity, and Android blocked it. 1.3.10 pins that screen across the consent dialog and waits for it before starting the hidden window.
          files: dist/GhostDisplay-1.3.10-debug.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
